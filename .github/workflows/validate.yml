name: Validate Dexplora

on:
  push:
    branches: [master, staging, feature/complimentary-booking-pricing]
  pull_request:

permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        # Current lockfile has historical transitive version drift; npm install
        # resolves dependencies until the lockfile is regenerated in a separate change.
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Validate TypeScript
        run: npx tsc --noEmit
      - name: Production build check
        run: npm run build
